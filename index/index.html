<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giới thiệu bản thân</title>
    <style>
        .profile-card {
            max-width: 300px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            font-family: Arial, sans-serif;
            background: #fff;
        }
        .profile-card img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
        }
        .profile-card h2 {
            margin: 0 0 5px;
            color: #333;
        }
        .profile-card p {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <img src="https://via.placeholder.com/100" alt="Avatar">
        <h2>Tên của bạn</h2>
        <p>Xin chào! Mình là một lập trình viên tập sự, thích khám phá công nghệ và sáng tạo những điều mới mẻ.</p>
    </div>

</body>
</html>
